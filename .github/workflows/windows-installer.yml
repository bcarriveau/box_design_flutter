name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Zip portable build
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath BoxDesign-portable-${{ steps.version.outputs.version }}.zip

      - name: Build installer
        run: iscc /DMyAppVersion=${{ steps.version.outputs.version }} windows\installer\box_design.iss

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoxDesign-portable
          path: BoxDesign-portable-*.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoxDesign-installer
          path: windows/installer/Output/*.exe

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BoxDesign-portable-*.zip
            windows/installer/Output/*.exe
